*{

html{
  scroll-behavior:smooth
}

html,body{

  background:var(--bg)
}

button{
  cursor:pointer;
  transition:transform .12s ease
}

button:active{
  transform:scale(.95)
}

@keyframes pop{
  0%{
    transform:scale(1)
  }

  40%{
    transform:scale(1.35)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  20%,60%{
    transform:translateX(-5px)
  }

  40%,80%{
    transform:translateX(5px)
  }
}

.animate-shake{
  animation:shake .4s ease
}

.animate-pop{
  animation:pop .35s ease
}

@keyframes heartPop{
  0%{
    transform:scale(1)
  }

  40%{
    transform:scale(1.45)
  }

  100%{
    transform:scale(1)
  }
}

.animate-heart-pop{
  animation:heartPop .35s ease
}

@keyframes slideOut{
  to{
    transform:translateX(-100%);
    opacity:0
  }
}

.animate-slide-out{
  animation:slideOut .3s ease forwards
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

@keyframes whatsappPulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.06)
  }
}

  animation:whatsappPulse 2s ease-in-out infinite
